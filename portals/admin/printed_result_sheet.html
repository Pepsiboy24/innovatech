<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result Sheet — Printable View | Admin</title>
    <link rel="stylesheet" href="/styles/dashboard_admin.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/assets/logo.png">
    <style>
        /* ── Print-only styling: hides everything except the result sheet ── */
        @media print {
            body * { visibility: hidden; }
            #resultSheetPrintRoot, #resultSheetPrintRoot * { visibility: visible; }
            #resultSheetPrintRoot {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
                border-radius: 0;
            }
            .no-print { display: none !important; }
            #printControls { display: none; }
        }

        #resultSheetPrintRoot {
            background: #fff;
            margin: 24px auto;
            max-width: 820px;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #1e293b;
        }
        .result-sheet-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 3px double #cbd5e1;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .result-sheet-header img { max-width: 72px; max-height: 72px; object-fit: contain; }
        .result-sheet-header h1 { font-size: 22px; margin: 0; color: var(--accent, #0066cc); }
        .result-sheet-header p { margin: 2px 0 0; font-size: 13px; color: #64748b; }
        .student-block { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; margin-bottom: 16px; font-size: 14px; }
        .student-block .lbl { color: #64748b; }
        .subject-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
        .subject-table th, .subject-table td { border: 1px solid #cbd5e1; padding: 7px 10px; text-align: left; font-size: 13px; }
        .subject-table th { background: #f1f5f9; }
        .subject-table td.num, .subject-table th.num { text-align: center; }
        .grade-badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 700; font-size: 12px; }
        .grade-remark { font-size: 12px; color: #475569; }
        .summary-strip {
            display: flex;
            justify-content: space-between;
            border-top: 2px solid #cbd5e1;
            padding-top: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .result-sheet-footer {
            margin-top: 16px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body data-sideBar>
    <div class="dashboard-layout">
        <!-- Sidebar (shared admin nav) -->
        <aside>
            <div id="sidebarContainer"></div>
        </aside>

        <main class="main-content">
            <header class="page-header no-print">
                <button class="icon mobile-menu-btn" data-sideBar><i class="fa fa-bars"></i></button>
                <div>
                    <h1>Printable Result Sheet</h1>
                    <p>Live preview of the student's report card using your selected template. Use the Print or PDF buttons.</p>
                </div>
            </header>

            <!-- Controls (hidden when printing) -->
            <section class="card no-print" id="printControls">
                <div class="form-grid" style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;">
                    <div class="form-group" style="flex:1; min-width:220px;">
                        <label for="studentSelect">Student *</label>
                        <select id="studentSelect"><option value="">Select a student…</option></select>
                    </div>
                    <div class="form-group" style="flex:1; min-width:220px;">
                        <label for="templateSelect">Result Sheet Template *</label>
                        <select id="templateSelect"><option value="">Select a template…</option></select>
                    </div>
                    <div class="form-group" style="flex:1; min-width:180px;">
                        <label for="termSelect">Term</label>
                        <select id="termSelect">
                            <option>First Term</option>
                            <option>Second Term</option>
                            <option>Third Term</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <button id="generateBtn" class="btn btn-primary"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate</button>
                        <button id="printBtn" class="btn btn-outline" disabled><i class="fa-solid fa-print"></i> Print</button>
                        <button id="pdfBtn" class="btn btn-outline" disabled><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
                    </div>
                </div>
            </section>

            <!-- Rendered result sheet (print target) -->
            <div id="resultSheetPrintRoot"></div>
        </main>
    </div>

    <!-- jsPDF: real PDF export (UMD 2.5.1 — same CDN + window.jspdf.jsPDF pattern as upload_notes.html) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Font-Awesome/6.5.1/webfonts/fa-solid-900.woff2" defer></script>
    <script type="module" src="./printed_result_sheet.js"></script>
</body>
</html>
