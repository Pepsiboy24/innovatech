<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <script type="module" src="../../core/authGuard.js"></script>
    <meta charset="UTF-8">
    <title>Results (Scores) - Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./schoolAdminStyles/adminPortal.css">
    <script type="module" src="../../core/config.js"></script>
    <style>
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-row .form-group {
            flex: 1;
            min-width: 160px;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
        }
        .results-table th,
        .results-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .results-table th {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: var(--bg-light);
        }
        .score-input {
            width: 90px;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
        }
        .comment-input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
        .primary-actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" data-sideBar></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-copy">
                    <div class="header-chip">Admin</div>
                    <div class="header-title-row">
                        <h1 class="page-title">Results (Scores)</h1>
                        <p class="page-subtitle">Enter, import and save student scores for any class and subject</p>
                    </div>
                </div>
                <div class="stuff">
                    <div class="profile" aria-label="Profile"></div>
                    <button class="icon" type="button" data-sideBarOpen aria-label="Open navigation menu">
                        <i class="fa fa-bars"></i>
                    </button>
                </div>
            </div>

            <!-- Score Entry Form -->
            <section class="section">
                <div class="section-header">
                    <h2>Result Entry Details</h2>
                </div>
                <div class="section-content">
                    <form id="resultsForm">
                        <div class="filter-row">
                            <div class="form-group">
                                <label for="academicSessionSelect">Academic Session</label>
                                <select id="academicSessionSelect" required>
                                    <option value="">Select Session</option>
                                    <option value="2025/2026">2025/2026</option>
                                    <option value="2026/2027">2026/2027</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="termSelect">Term</label>
                                <select id="termSelect" required>
                                    <option value="">Select Term</option>
                                    <option value="First Term">1st Term</option>
                                    <option value="Second Term">2nd Term</option>
                                    <option value="Third Term">3rd Term</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="assessmentTypeSelect">Assessment Type</label>
                                <select id="assessmentTypeSelect" required>
                                    <option value="">Assessment Type</option>
                                    <option value="CA1">1st CA</option>
                                    <option value="CA2">2nd CA</option>
                                    <option value="Exam">Exam</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="maxScoreInput">Max Score</label>
                                <input type="number" id="maxScoreInput" placeholder="e.g. 100" min="1" required>
                            </div>
                        </div>

                        <div class="filter-row" style="margin-top: 16px;">
                            <div class="form-group">
                                <label for="classSelect">Class</label>
                                <select id="classSelect" required>
                                    <option value="">Select Class</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="subjectSelect">Subject</label>
                                <select id="subjectSelect" required>
                                    <option value="">Select Subject</option>
                                </select>
                            </div>
                            <div class="form-group" style="flex: 0 0 auto; align-self: flex-end;">
                                <input type="file" id="excelUpload" accept=".xlsx, .xls, .csv" style="display: none;">
                                <button type="button" id="importExcelBtn" class="btn btn-secondary"><i class="fa-solid fa-file-import"></i> Import Excel</button>
                            </div>
                        </div>

                        <div class="table-container">
                            <table class="results-table" id="studentsTable">
                                <thead>
                                    <tr>
                                        <th>Student Name</th>
                                        <th>Student ID</th>
                                        <th>Score</th>
                                        <th>Comment</th>
                                    </tr>
                                </thead>
                                <tbody id="studentTableBody">
                                    <tr>
                                        <td colspan="4" style="text-align: center; padding: 30px; color: var(--text-gray);">
                                            Please select a Class and Subject to load the student list.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="primary-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-save"></i> Save Results
                            </button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js-shared/ui_feedback.js"></script>
    <script type="module" src="./school_admin_sidebar.js"></script>
    <script type="module" src="./results_page.js"></script>

    <script>
        // Trigger the hidden file input
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('importExcelBtn')?.addEventListener('click', () => {
                document.getElementById('excelUpload').click();
            });
        });
    </script>
</body>
</html>
