<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <script type="module" src="../../core/authGuard.js"></script>
    <meta charset="UTF-8">
    <title>Result Sheet Templates - Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./schoolAdminStyles/adminPortal.css">
    <script type="module" src="../../core/config.js"></script>
    <style>
        .template-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }
        .hint {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 6px;
        }
        .editor-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .template-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px;
            background: var(--white);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
        }
        .btn-xs {
            padding: 7px 12px;
            font-size: 12px;
        }
        .btn-outline {
            background: var(--white);
            color: var(--text-gray);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-xs[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .layout-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-block {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px;
            background: var(--white);
        }
        .form-block-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-block-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .form-block-title-row .form-block-title {
            margin-bottom: 0;
        }
        .hint-inline {
            font-weight: 400;
            font-size: 12px;
            color: var(--text-gray);
        }
        .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
        }
        .form-row-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .trait-label {
            font-size: 12px;
            text-transform: capitalize;
        }
        .columns-editor {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .col-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }
        .col-arrows {
            display: flex;
            gap: 6px;
        }
        .col-btn {
            width: 30px;
            height: 30px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--white);
            color: var(--text-gray);
            cursor: pointer;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .col-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .remarks-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        @media (max-width: 720px) {
            .form-row-grid {
                grid-template-columns: 1fr;
            }
            .remarks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" data-sideBar></aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-copy">
                    <div class="header-chip">Admin</div>
                    <div class="header-title-row">
                        <h1 class="page-title">Result Sheet Templates</h1>
                        <p class="page-subtitle">Design the report-card / result-sheet layout used by the printable result sheet</p>
                    </div>
                </div>
                <div class="stuff">
                    <div class="profile" aria-label="Profile"></div>
                    <button class="icon" type="button" data-sideBarOpen aria-label="Open navigation menu">
                        <i class="fa fa-bars"></i>
                    </button>
                </div>
            </div>

            <!-- Alerts -->
            <div id="alertContainer"></div>

            <!-- Template List -->
            <section class="section">
                <div class="section-header">
                    <h2>Your Templates</h2>
                    <div class="section-header-actions">
                        <button id="newTemplateBtn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Template</button>
                    </div>
                </div>
                <div id="templateList" class="template-list"></div>
            </section>

            <!-- Template Editor (hidden until create/edit) -->
            <section id="templateEditorSection" class="section" style="display:none;">
                <div class="section-header">
                    <h2 id="editorTitle">New Template</h2>
                    <div class="section-header-actions">
                        <button id="cancelEditBtn" class="btn btn-secondary">Cancel</button>
                        <button id="saveTemplateBtn" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Template</button>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="templateName">Template Name *</label>
                        <input type="text" id="templateName" placeholder="e.g. Standard WAEC/NECO Result Sheet">
                    </div>
                    <div class="form-group">
                        <label for="templateDescription">Description</label>
                        <input type="text" id="templateDescription" placeholder="e.g. Used for end-of-term report cards">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <label>Layout</label>
                    <div class="layout-form">

                        <!-- Header -->
                        <div class="form-block">
                            <div class="form-block-title">Header</div>
                            <div class="form-group" style="margin-bottom: 10px;">
                                <label for="hdrTitle">Sheet Title</label>
                                <input type="text" id="hdrTitle" placeholder="e.g. Student Result Sheet">
                            </div>
                            <div class="checkbox-grid">
                                <label class="checkbox-label">
                                    <input type="checkbox" id="hdrLogo">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show logo</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="hdrSchoolName">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show school name</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="hdrAddress">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show address</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="hdrPhone">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show phone</span>
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="hdrTerm">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show term</span>
                                </label>
                            </div>
                        </div>

                        <!-- Columns -->
                        <div class="form-block">
                            <div class="form-block-title">
                                Subject Columns
                                <span class="hint-inline">Use the arrows to change their order on the sheet</span>
                            </div>
                            <div id="columnsEditor" class="columns-editor"></div>
                        </div>

                        <!-- Affective -->
                        <div class="form-block">
                            <div class="form-block-title-row">
                                <span class="form-block-title">Affective Domain</span>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="affShow">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show on sheet</span>
                                </label>
                            </div>
                            <div class="form-row-grid">
                                <div class="form-group"><label class="trait-label" for="aff-attendance">Attendance</label><input type="text" id="aff-attendance" placeholder="e.g. Present"></div>
                                <div class="form-group"><label class="trait-label" for="aff-punctuality">Punctuality</label><input type="text" id="aff-punctuality" placeholder="e.g. Punctual"></div>
                                <div class="form-group"><label class="trait-label" for="aff-attitudeToWork">Attitude to Work</label><input type="text" id="aff-attitudeToWork" placeholder="e.g. Good"></div>
                                <div class="form-group"><label class="trait-label" for="aff-conduct">Conduct</label><input type="text" id="aff-conduct" placeholder="e.g. Orderly"></div>
                                <div class="form-group"><label class="trait-label" for="aff-neatness">Neatness</label><input type="text" id="aff-neatness" placeholder="e.g. Tidy"></div>
                                <div class="form-group"><label class="trait-label" for="aff-speech">Speech</label><input type="text" id="aff-speech" placeholder="e.g. Fluent"></div>
                                <div class="form-group"><label class="trait-label" for="aff-handwriting">Handwriting</label><input type="text" id="aff-handwriting" placeholder="e.g. Legible"></div>
                            </div>
                        </div>

                        <!-- Psychomotor -->
                        <div class="form-block">
                            <div class="form-block-title-row">
                                <span class="form-block-title">Psychomotor Domain</span>
                                <label class="checkbox-label">
                                    <input type="checkbox" id="psyShow">
                                    <span class="checkmark"></span>
                                    <span class="checkbox-text">Show on sheet</span>
                                </label>
                            </div>
                            <div class="form-row-grid">
                                <div class="form-group"><label class="trait-label" for="psy-handlingTools">Handling Tools</label><input type="text" id="psy-handlingTools" placeholder="e.g. Good"></div>
                                <div class="form-group"><label class="trait-label" for="psy-games">Games</label><input type="text" id="psy-games" placeholder="e.g. Fair"></div>
                                <div class="form-group"><label class="trait-label" for="psy-creativeArts">Creative Arts</label><input type="text" id="psy-creativeArts" placeholder="e.g. Good"></div>
                                <div class="form-group"><label class="trait-label" for="psy-musicalSkills">Musical Skills</label><input type="text" id="psy-musicalSkills" placeholder="e.g. Fair"></div>
                            </div>
                        </div>

                        <!-- Remarks -->
                        <div class="form-block">
                            <div class="form-block-title">Remarks</div>
                            <div class="remarks-grid">
                                <div class="form-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="remClassTeacher">
                                        <span class="checkmark"></span>
                                        <span class="checkbox-text">Class Teacher's remark</span>
                                    </label>
                                    <textarea id="remClassTeacherDefault" rows="2" class="textarea" placeholder="Default wording shown on the sheet"></textarea>
                                </div>
                                <div class="form-group">
                                    <label class="checkbox-label">
                                        <input type="checkbox" id="remPrincipal">
                                        <span class="checkmark"></span>
                                        <span class="checkbox-text">Principal's remark</span>
                                    </label>
                                    <textarea id="remPrincipalDefault" rows="2" class="textarea" placeholder="Default wording shown on the sheet"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Styling & notes -->
                        <div class="form-block">
                            <div class="form-block-title">Styling &amp; Notes</div>
                            <div class="form-row-grid">
                                <div class="form-group" style="max-width: 220px;">
                                    <label for="accentColor">Accent Color</label>
                                    <input type="color" id="accentColor" value="#0066cc">
                                </div>
                                <div class="form-group" style="grid-column: span 2;">
                                    <label for="footerNote">Footer Note</label>
                                    <input type="text" id="footerNote" placeholder="e.g. Computer-generated, no signature required">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="form-group" style="margin-top: 16px; flex-direction: row; gap: 24px; flex-wrap: wrap;">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isDefaultTemplate">
                        <span class="checkmark"></span>
                        <span class="checkbox-text">Set as the school's default template</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="isActiveTemplate" checked>
                        <span class="checkmark"></span>
                        <span class="checkbox-text">Active (available for printing)</span>
                    </label>
                </div>
            </section>

            <!-- Live Preview -->
            <section id="previewSection" class="section" style="display:none;">
                <div class="section-header">
                    <h2>Print Preview</h2>
                </div>
                <div id="templatePreview"></div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../../assets/js-shared/ui_feedback.js"></script>
    <script type="module" src="./school_admin_sidebar.js"></script>
    <script type="module" src="./result_template_editor.js"></script>
</body>
</html>
