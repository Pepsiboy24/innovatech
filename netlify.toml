[build]
  publish = "."

# NOTE: targets have no .html on purpose (see _redirects). If you deploy on
# Cloudflare Pages this file is ignored and can be deleted.
# ── Auth pages ──────────────────────────────────────────
[[redirects]]
  from = "/"
  to   = "/public/html/login"
  status = 200

[[redirects]]
  from = "/login"
  to   = "/public/html/login"
  status = 200

[[redirects]]
  from = "/signup"
  to   = "/public/html/signup"
  status = 200

[[redirects]]
  from = "/change-password"
  to   = "/public/html/change_password"
  status = 200

[[redirects]]
  from = "/forgot-password"
  to   = "/public/html/forgot_password"
  status = 200

[[redirects]]
  from = "/reset-password"
  to   = "/public/reset_password"
  status = 200

# ── Admin portal ────────────────────────────────────────
[[redirects]]
  from = "/admin"
  to   = "/portals/admin/schoolAdminDashboard"
  status = 200

[[redirects]]
  from = "/admin/*"
  to   = "/portals/admin/:splat"
  status = 200

# ── Teacher portal ──────────────────────────────────────
[[redirects]]
  from = "/teacher"
  to   = "/portals/teacher/teachersPortal"
  status = 200

[[redirects]]
  from = "/teacher/*"
  to   = "/portals/teacher/:splat"
  status = 200

# ── Parent portal ───────────────────────────────────────
[[redirects]]
  from = "/parent"
  to   = "/portals/parent/parentsPortal"
  status = 200

[[redirects]]
  from = "/parent/*"
  to   = "/portals/parent/:splat"
  status = 200

# ── Student portal ──────────────────────────────────────
[[redirects]]
  from = "/student"
  to   = "/portals/student/studentPortal"
  status = 200

[[redirects]]
  from = "/student/*"
  to   = "/portals/student/:splat"
  status = 200

# ── Shared assets (core, assets, supabase) pass through ─
# No rules needed — Netlify serves these as static files
# from the repo root automatically.
