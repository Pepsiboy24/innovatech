<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a new password - EduHub</title>
    <link rel="stylesheet" href="/public/styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .msg { display:none; margin:0 0 16px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.4; }
        .msg.error { display:block; background:rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.35); }
        .msg.success { display:block; background:rgba(34,197,94,.12); color:#86efac; border:1px solid rgba(34,197,94,.35); }
        .hint { font-size:13px; opacity:.75; margin-top:6px; }
        .linkish { background:none; border:0; color:inherit; text-decoration:underline; cursor:pointer; font:inherit; opacity:.8; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo"><i class="fas fa-graduation-cap"></i><span>EduHub</span></div>
                <h1>Choose your own password</h1>
                <p>You signed in with a temporary password. Set a new one to continue.</p>
            </div>
            <div id="msg" class="msg" role="alert"></div>

            <form id="pwForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
                    <div class="hint">Use letters and numbers. Don't use your name or a simple number sequence.</div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" required placeholder="Type it again">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="saveBtn">Save password</button>
            </form>

            <div class="auth-footer"><p><button type="button" class="linkish" id="logoutBtn">Sign out</button></p></div>
        </div>
    </div>
    <script type="module">
        import { supabase } from '/core/config.js';
        import { homeFor } from '/core/loginIdentity.js';

        const msg = document.getElementById('msg');
        function show(text, kind) { msg.textContent = text; msg.className = 'msg ' + kind; }
        function checkPasswords(a, b) {
            if (a.length < 8) return 'Password must be at least 8 characters.';
            if (!/[a-zA-Z]/.test(a) || !/[0-9]/.test(a)) return 'Use both letters and numbers.';
            if (/^(.)\1+$/.test(a) || /12345678|password|qwerty/i.test(a)) return 'That password is too easy to guess.';
            if (a !== b) return 'The two passwords do not match.';
            return null;
        }

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.replace('/login'); }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.replace('/login');
        });

        document.getElementById('pwForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const a = document.getElementById('newPassword').value;
            const b = document.getElementById('confirmPassword').value;
            const problem = checkPasswords(a, b);
            if (problem) return show(problem, 'error');

            const btn = document.getElementById('saveBtn');
            btn.disabled = true; btn.textContent = 'Saving...';
            try {
                const { error } = await supabase.auth.updateUser({ password: a });
                if (error) throw error;

                // Clear the "must change password" flag (server-side, SECURITY DEFINER function).
                const { error: rpcErr } = await supabase.rpc('complete_password_change');
                if (rpcErr) throw new Error('Your password was changed, but we could not finish setup (' + rpcErr.message + '). Please tell your school admin.');

                // Pull a fresh token so the flag is gone from the session too.
                await supabase.auth.refreshSession();
                const { data: { user: fresh } } = await supabase.auth.getUser();
                show('Password saved. Taking you to your dashboard...', 'success');
                setTimeout(() => window.location.replace(homeFor(fresh?.user_metadata?.user_type)), 800);
            } catch (err) {
                show(err.message || 'Could not save your password. Try again.', 'error');
                btn.disabled = false; btn.textContent = 'Save password';
            }
        });
    </script>
</body>
</html>
