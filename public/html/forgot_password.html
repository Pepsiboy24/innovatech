<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - EduHub</title>
    <link rel="stylesheet" href="/public/styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .msg { display:none; margin:0 0 16px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.4; }
        .msg.error { display:block; background:rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.35); }
        .msg.success { display:block; background:rgba(34,197,94,.12); color:#86efac; border:1px solid rgba(34,197,94,.35); }
        .hint { font-size:13px; opacity:.75; margin-top:6px; }
        .linkish { background:none; border:0; color:inherit; text-decoration:underline; cursor:pointer; font:inherit; opacity:.8; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo"><i class="fas fa-graduation-cap"></i><span>EduHub</span></div>
                <h1>Forgot your password?</h1>
                <p>Enter the email you registered with and we will send you a reset link.</p>
            </div>
            <div id="msg" class="msg" role="alert"></div>

            <form id="forgotForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="sendBtn">Send reset link</button>
            </form>
            <div class="hint" style="margin-top:16px;">
                Logging in with a <strong>username</strong> (like amina.bello@school) or a <strong>phone number</strong>?
                There is no email on your account, so ask your teacher or school admin to reset your password.
            </div>
            <div class="auth-footer"><p><a href="/login">Back to sign in</a></p></div>
        </div>
    </div>
    <script type="module">
        import { supabase } from '/core/config.js';

        const msg = document.getElementById('msg');
        function show(text, kind) { msg.textContent = text; msg.className = 'msg ' + kind; }
        function checkPasswords(a, b) {
            if (a.length < 8) return 'Password must be at least 8 characters.';
            if (!/[a-zA-Z]/.test(a) || !/[0-9]/.test(a)) return 'Use both letters and numbers.';
            if (/^(.)\1+$/.test(a) || /12345678|password|qwerty/i.test(a)) return 'That password is too easy to guess.';
            if (a !== b) return 'The two passwords do not match.';
            return null;
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('Enter a valid email address.', 'error');

            const btn = document.getElementById('sendBtn');
            btn.disabled = true; btn.textContent = 'Sending...';
            try {
                await supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password' });
            } catch (err) { console.error(err); }
            // Same answer whether or not the email exists, so nobody can probe for accounts.
            show('If that email has an account, a reset link is on its way. Check your inbox and spam folder.', 'success');
            btn.textContent = 'Sent';
        });
    </script>
</body>
</html>
